# ~/.config/qamariah-livepaper/config.ini — semua baris opsional
[livepaper]
# lokasi pengamat (desimal; selatan & barat negatif) — menentukan posisi
# matahari, bulan, dan bintang yang terlihat
lat = -6.2
lon = 106.8
# frame per detik untuk laut (1–30). Gelombang pelan → 8–12 sudah halus
fps = 12
# posisi cakrawala dari atas layar (0.4–0.85)
horizon = 0.68
# pemandangan: sea (laut bergaris gelombang) | valley (lukisan tinta: bukit
# berkabut, danau, dedalu dan bambu tertiup angin, burung saat cerah)
scene = sea
# geser seluruh gambar beberapa piksel per jam (anti burn-in OLED)
drift = yes
# jumlah garis gelombang (4–20)
waves = 10
# tampilkan bulan saat matahari masih di atas cakrawala (realistis = yes)
moon_daytime = yes
# bintang sesuai lokasi & jam (904 bintang Yale Bright Star Catalog)
stars = yes
# magnitudo bintang terlemah: 4.5 langit desa gelap, 3.5 pinggir kota, 2.5 kota terang
star_limit = 4.5
# jari-jari matahari sebagai pecahan lebar layar; bulan otomatis
# ~97% ukuran matahari, ±7% mengikuti jarak bulan (supermoon/micromoon)
body_size = 0.02

# ── planet ──
# daftar planet yang ditampilkan (kosongkan untuk mematikan):
# mercury, venus, mars, jupiter, saturn
planets = mercury,venus,mars,jupiter,saturn

# ── cuaca ──
# live   : cuaca nyata dari Open-Meteo sesuai lat/lon (tanpa API key; koordinat
#          dibulatkan ~1 km). Kalau offline → otomatis pakai sim.
# sim    : simulasi pola tropis (pagi cerah, awan siang, peluang hujan sore,
#          angin siang dari timur → awan ke kanan, malam berbalik ke kiri)
# clear | cloudy | rain | storm | fog : tetap
weather = live
# menit antar pengambilan data cuaca (live)
weather_refresh = 20
# jumlah awan saat langit tertutup penuh (cerah ±2, berawan ±9, hujan ±14, badai 16)
clouds_max = 16
# kilat redup sesaat saat badai
lightning = yes
# fps langit saat berawan (hujan memakai fps laut agar butiran halus)
sky_fps = 4
